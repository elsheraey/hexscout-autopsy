<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEXscout — Stake</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
<main class="page">

  <h1 class="page-title">Stake</h1>

  <div class="card">
    <div class="label">I want to stake</div>
    <div class="card-row" style="margin-top:6px;">
      <button class="btn btn-sm" style="background:rgba(255,90,54,0.18);color:#ffb19b;">pHEX ▾</button>
      <div style="font-family:'Russo One';font-size:14px;color:var(--text-muted);">$ <span id="usd-est">957</span></div>
    </div>
    <div class="slider-block">
      <div class="head"><div class="v" id="amt-val">100,000<small>HEX</small></div></div>
      <input type="range" id="amt-slider" min="1000" max="10000000" step="1000" value="100000">
    </div>
  </div>

  <div class="card">
    <div class="label">For</div>
    <div class="slider-block">
      <div class="head"><div class="v" id="days-val">365<small>days</small></div></div>
      <input type="range" id="days-slider" min="1" max="5555" step="1" value="365">
    </div>
  </div>

  <div class="card">
    <div class="label">Stake type</div>
    <div class="toggle-group" style="margin-top:8px;">
      <button class="on" id="ttype-native">Native</button>
      <button id="ttype-hsi">HSI</button>
    </div>
  </div>

  <a class="btn btn-magenta btn-full" href="start/stake/execute.html">⇨ Start Stake</a>

  <div class="card" style="margin-top:18px;">
    <div class="section-title" style="margin-top:0;">Your Stake</div>
    <div class="card-row" style="margin-bottom:8px;">
      <span style="color:var(--text-muted);font-size:13px;">Start Date</span>
      <span style="font-weight:600;color:var(--accent-2);" id="start-date">24 December 2023</span>
    </div>
    <div class="card-row">
      <span style="color:var(--text-muted);font-size:13px;">Maturity Date</span>
      <span style="font-weight:600;color:var(--accent-2);" id="end-date">23 December 2024</span>
    </div>
  </div>

  <div class="card">
    <div class="section-title" style="margin-top:0;">Staking Bonuses</div>
    <div class="card-row" style="padding:8px 0;">
      <span>BiggerPaysBetter <span class="tag">?</span></span>
      <span style="font-weight:600;" id="bpb">6.67 <small style="color:var(--text-muted);">★</small></span>
    </div>
    <div style="height:1px;background:var(--border);margin:6px 0;"></div>
    <div class="card-row" style="padding:8px 0;">
      <span>LongerPaysBetter <span class="tag">?</span></span>
      <span style="font-weight:600;" id="lpb">20,000 <small style="color:var(--text-muted);">★</small></span>
    </div>
  </div>

  <div class="card">
    <div class="card-row" style="margin-bottom:8px;">
      <span style="color:var(--text-muted);font-size:13px;">Effective HEX</span>
      <span style="font-weight:600;" id="effective">120,667</span>
    </div>
    <div class="card-row" style="margin-bottom:8px;">
      <span style="color:var(--text-muted);font-size:13px;">T-Shares earned</span>
      <span style="font-weight:600;color:var(--accent-2);" id="tshares">1.42</span>
    </div>
    <div class="card-row">
      <span style="color:var(--text-muted);font-size:13px;">Expected yield (today's rate)</span>
      <span style="font-weight:600;color:var(--green);" id="yield">38.2% APY</span>
    </div>
  </div>

</main>
</div>

<script>window.PREFIX="";</script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
renderShell();
const amt = document.getElementById("amt-slider");
const amtVal = document.getElementById("amt-val");
const days = document.getElementById("days-slider");
const daysVal = document.getElementById("days-val");
const usdEst = document.getElementById("usd-est");
const startDateEl = document.getElementById("start-date");
const endDateEl = document.getElementById("end-date");
const effEl = document.getElementById("effective");
const tshEl = document.getElementById("tshares");
const apyEl = document.getElementById("yield");
const bpbEl = document.getElementById("bpb");
const lpbEl = document.getElementById("lpb");

const monthsShort = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const today = new Date(2024, 0, 24);

function recalc() {
  const a = +amt.value, d = +days.value;
  amtVal.innerHTML = a.toLocaleString() + " <small>HEX</small>";
  daysVal.innerHTML = d + " <small>days</small>";
  usdEst.textContent = Math.round(a * SAMPLE.prices.hexUSD).toLocaleString();

  // Cute fake bonuses
  const bpb = Math.min(10, (a / 150000) * 6.67);
  const lpb = Math.min(200000, d * 54.79);
  bpbEl.innerHTML = bpb.toFixed(2) + ' <small style="color:var(--text-muted);">★</small>';
  lpbEl.innerHTML = Math.round(lpb).toLocaleString() + ' <small style="color:var(--text-muted);">★</small>';

  const effective = Math.round(a * (1 + bpb/100) * (1 + lpb/1000000));
  const tsh = (effective / 85000).toFixed(2);
  effEl.textContent = effective.toLocaleString();
  tshEl.textContent = tsh;
  apyEl.textContent = (Math.min(60, 20 + d * 0.03) ).toFixed(1) + "% APY";

  const end = new Date(today.getTime() + d * 86400000);
  endDateEl.textContent = `${end.getDate()} ${monthsShort[end.getMonth()]} ${end.getFullYear()}`;
}
bindSlider(amt, recalc);
bindSlider(days, recalc);

document.getElementById("ttype-native").addEventListener("click", function () {
  this.classList.add("on"); document.getElementById("ttype-hsi").classList.remove("on");
});
document.getElementById("ttype-hsi").addEventListener("click", function () {
  this.classList.add("on"); document.getElementById("ttype-native").classList.remove("on");
});
recalc();
</script>
</body>
</html>
