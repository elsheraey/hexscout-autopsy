<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEXscout — News editor</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app">
<main class="page">

<h1 class="page-title">News editor</h1>
<div class="card">
  <div class="label">Title</div>
  <input type="text" style="width:100%;margin-top:6px;padding:12px;background:var(--bg-elev);border:1px solid var(--border);border-radius:8px;color:#fff;font-family:inherit;font-size:14px;" value="PulseX V3 quietly ships concentrated liquidity">
</div>
<div class="card">
  <div class="label">Body</div>
  <textarea style="width:100%;margin-top:6px;padding:12px;background:var(--bg-elev);border:1px solid var(--border);border-radius:8px;color:#fff;font-family:inherit;font-size:14px;min-height:180px;">Liquidity providers now pick a price range. Capital efficiency in HEX/WPLS up 12× on day-one estimates...</textarea>
</div>
<div class="card-row">
  <button class="btn btn-sm">Save draft</button>
  <button class="btn btn-sm btn-primary">Publish</button>
</div>

</main>
</div>
<script>window.PREFIX="../";</script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>renderShell(null);</script>
</body>
</html>
