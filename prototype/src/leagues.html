<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEXscout — Leagues</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
<main class="page">

  <h1 class="page-title">Leagues</h1>

  <div class="card">
    <div style="display:flex;justify-content:center;margin:6px 0;" id="donut"></div>
    <div style="text-align:center;margin-top:4px;color:var(--text-muted);font-size:12px;">Total HEX staked</div>
  </div>

  <div class="card">
    <table class="tbl">
      <thead><tr><th>League</th><th>Min. T-Shares</th><th>Stakers</th></tr></thead>
      <tbody id="tier-rows"></tbody>
    </table>
  </div>

  <div class="section-title">Your 4,710 T-Shares <small style="font-weight:normal;text-transform:none;color:var(--accent-2);">Sharks</small></div>
  <div class="stat-grid">
    <div class="stat"><div class="v">113</div><div class="l">HEX score</div></div>
    <div class="stat"><div class="v">87%</div><div class="l">Vs avg</div></div>
    <div class="stat"><div class="v">212</div><div class="l">Rank</div></div>
  </div>

</main>
</div>

<script>window.PREFIX="";</script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
renderShell();
const L = SAMPLE.league;
document.getElementById("donut").innerHTML = donutSVG(
  L.distribution, { size: 200, stroke: 24, gap: 1.5, center: "$648" }
);
document.getElementById("tier-rows").innerHTML = L.tiers.map(t => `
  <tr>
    <td><span class="ic" style="background:${t.color}33;">${t.icon}</span>${t.name}</td>
    <td>${t.min.toLocaleString()}</td>
    <td>${t.count.toLocaleString()}</td>
  </tr>
`).join("");
</script>
</body>
</html>
