<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEXscout — Deep Dive</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
<main class="page">

<h1 class="page-title">Deep Dive</h1>
<p style="color:var(--text-muted);font-size:13px;margin-top:-8px;">Granular HEX metrics for power users.</p>
<div class="stat-grid">
  <div class="stat"><div class="v">5,232</div><div class="l">T-share rate</div></div>
  <div class="stat"><div class="v">+1.34%</div><div class="l">T-share Δ7d</div></div>
  <div class="stat"><div class="v">1,247</div><div class="l">RH stake (d)</div></div>
</div>
<div class="stat-grid">
  <div class="stat"><div class="v">13.4B</div><div class="l">Staked HEX</div></div>
  <div class="stat"><div class="v">99.3%</div><div class="l">Locked supply</div></div>
  <div class="stat"><div class="v">5,432</div><div class="l">Avg length (d)</div></div>
</div>
<div class="section-title">Inflation by day</div>
<div class="card"><div class="chart-box" id="d-chart"></div></div>
<div class="section-title">Stake-end pressure</div>
<div class="card"><div class="chart-box" id="se-chart"></div></div>

</main>
</div>
<script>window.PREFIX="";</script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>renderShell(null);
document.getElementById('d-chart').innerHTML = lineChartSVG(SAMPLE.marketChart.slice(-60));
document.getElementById('se-chart').innerHTML = lineChartSVG(SAMPLE.marketChart.slice(-120).map(p=>({t:p.t,p:p.p*Math.random()*0.3+0.005})));
</script>
</body>
</html>
