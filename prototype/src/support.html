<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEXscout — Support</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
<main class="page">

<h1 class="page-title">Support</h1>
<p style="color:var(--text-muted);font-size:13px;margin-top:-8px;">Get help in &lt; 4 hours from a real human.</p>
<div class="card">
  <div class="label">What do you need help with?</div>
  <textarea style="width:100%;margin-top:8px;padding:12px;background:var(--bg-elev);border:1px solid var(--border);border-radius:8px;color:#fff;font-family:inherit;font-size:14px;min-height:120px;" placeholder="Describe your issue..."></textarea>
</div>
<div class="card">
  <div class="label">Contact</div>
  <input type="email" placeholder="email@example.com" style="width:100%;margin-top:8px;padding:12px;background:var(--bg-elev);border:1px solid var(--border);border-radius:8px;color:#fff;font-family:inherit;font-size:14px;">
</div>
<div class="card" style="padding:6px 12px;">
  <div class="card-row" style="padding:10px 4px;">
    <div><div style="font-weight:600;">Wallet address (optional)</div><div style="font-size:12px;color:var(--text-muted);">If your issue is wallet-specific</div></div>
    <div class="switch" onclick="this.classList.toggle('on')"></div>
  </div>
</div>
<a class="btn btn-magenta btn-full" href="support/success.html">Send</a>
<div class="banner" style="margin-top:14px;">
  <div class="ic">💬</div>
  <div class="t">Prefer chat? Join us on Telegram <strong>@HEXscout</strong> for community support.</div>
</div>

</main>
</div>
<script>window.PREFIX="";</script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>renderShell(null);</script>
</body>
</html>
